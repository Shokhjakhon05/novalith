name: novalith
description: "Novalith - Cosmic Merge. Drop, merge and evolve the universe."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter

  # Game loop and canvas host. Physics is our own deterministic circle solver (lib/core), so
  # no physics package is needed.
  flame: ^1.38.2
  # Sound effects and the music loop.
  flame_audio: ^2.12.2
  # AdMob rewarded + interstitial ads and the UMP consent form. Only lib/services/ads touches it.
  google_mobile_ads: ^9.1.0
  # The single "Remove Ads" purchase.
  in_app_purchase: ^3.3.1
  # Location of the save file.
  path_provider: ^2.1.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/brand/logo.png
    - assets/audio/
  fonts:
    - family: Exo2
      fonts:
        - asset: assets/fonts/Exo2.ttf
